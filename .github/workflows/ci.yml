name: Continuous integration

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check app.py psydesign tests
      - name: Type-check Python
        run: python -m mypy app.py psydesign
      - name: Compile Python
        run: python -m compileall -q app.py psydesign tests
      - name: Run tests
        run: python -m pytest
      - name: Check browser JavaScript syntax when Node.js is available
        shell: bash
        run: |
          if command -v node >/dev/null 2>&1; then
            node --check static/script.js
          else
            echo "Node.js is unavailable; skipping the optional syntax check."
          fi
